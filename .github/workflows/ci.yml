name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - run: composer validate --no-check-publish
        continue-on-error: true
      - run: composer audit
        continue-on-error: true
      - run: docker compose config -q
